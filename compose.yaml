name: emenu-api

services:
  api: &laravel
    build: .
    env_file: .env
    volumes:
      - media:/var/www/html/storage/app/private
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PGCONNECT_TIMEOUT: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *laravel
    user: www-data
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=30", "--no-interaction"]
    restart: unless-stopped

  scheduler:
    <<: *laravel
    user: www-data
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  media:
