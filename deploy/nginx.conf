map $uri $api_authorization {
    default $http_authorization;
    ~^/api/v1/public/menus(?:/|$) "";
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 9m;

    add_header X-Content-Type-Options nosniff always;
    error_page 413 = @payload_too_large;
    error_page 502 504 = @api_unavailable;

    location @payload_too_large {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request exceeds the allowed size."},"requestId":"$request_id"}';
    }

    location @api_unavailable {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable."},"requestId":"$request_id"}';
    }

    location ~ ^/api(/.*)?$ {
        include fastcgi_params;
        fastcgi_param HTTP_COOKIE "";
        fastcgi_param HTTP_AUTHORIZATION $api_authorization;
        fastcgi_param HTTP_X_EMENU_CLIENT_IP $http_x_emenu_client_ip;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 30s;
        fastcgi_pass api:9000;
    }

    location / {
        return 404;
    }
}
